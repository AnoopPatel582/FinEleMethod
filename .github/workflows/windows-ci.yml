name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-2025-vs2026
    env:
      VCPKG_ROOT: C:\vcpkg

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Fetch pinned vcpkg baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git -C $env:VCPKG_ROOT fetch --depth=1 origin $baseline

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset windows-msvc-debug

      - name: Test
        run: ctest --preset windows-msvc-debug

      - name: Build Release applications
        run: cmake --build --preset windows-msvc-release --target FinEleMethodGui

      - name: Stage Release application
        run: >-
          cmake --install .\out\build\windows-msvc
          --config Release
          --prefix .\out\install\windows-msvc-release-ci

      - name: Verify staged application
        shell: pwsh
        run: >-
          .\cmake\VerifyStagedApplication.ps1
          -StageDirectory .\out\install\windows-msvc-release-ci
          -ReleaseDirectory .\out\build\windows-msvc\Release
