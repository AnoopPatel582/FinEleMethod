name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-2025-vs2026
    env:
      VCPKG_ROOT: C:\vcpkg

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check C++ formatting
        shell: pwsh
        run: .\cmake\CheckFormatting.ps1

      - name: Test archive safety
        shell: pwsh
        run: .\cmake\TestWindowsArchive.ps1

      - name: Test release manifest
        shell: pwsh
        run: .\cmake\TestWindowsReleaseManifest.ps1

      - name: Test packaged result validation
        shell: pwsh
        run: .\cmake\TestVtuVerification.ps1

      - name: Test packaged progress validation
        shell: pwsh
        run: .\cmake\TestPackagedProgress.ps1

      - name: Set up Python for documentation
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependency
        run: python -m pip install -r .\docs\requirements.txt

      - name: Build documentation
        run: mkdocs build --strict

      - name: Build C++ API documentation
        shell: pwsh
        run: .\cmake\BuildApiDocumentation.ps1

      - name: Fetch pinned vcpkg baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git -C $env:VCPKG_ROOT fetch --depth=1 origin $baseline

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Run clang-tidy
        shell: pwsh
        run: .\cmake\CheckClangTidy.ps1

      - name: Configure MSVC native analysis
        run: cmake --preset windows-msvc-analysis

      - name: Run MSVC native analysis
        run: cmake --build --preset windows-msvc-analysis

      - name: Build
        run: cmake --build --preset windows-msvc-debug

      - name: Test
        run: ctest --preset windows-msvc-debug

      - name: Build Release applications
        run: cmake --build --preset windows-msvc-release --target FinEleMethodGui

      - name: Stage Release application
        run: >-
          cmake --install .\out\build\windows-msvc
          --config Release
          --prefix .\out\install\windows-msvc-release-ci

      - name: Verify staged application
        shell: pwsh
        run: >-
          .\cmake\VerifyStagedApplication.ps1
          -StageDirectory .\out\install\windows-msvc-release-ci
          -ReleaseDirectory .\out\build\windows-msvc\Release

      - name: Create Windows ZIP archive
        shell: pwsh
        run: >-
          .\cmake\CreateWindowsArchive.ps1
          -StageDirectory .\out\install\windows-msvc-release-ci
          -OutputFile .\out\package\FinEleMethod-windows-x64.zip

      - name: Verify extracted Windows ZIP archive
        shell: pwsh
        run: |
          .\cmake\VerifyWindowsArchiveChecksum.ps1 `
            -ArchiveFile .\out\package\FinEleMethod-windows-x64.zip `
            -ChecksumFile .\out\package\FinEleMethod-windows-x64.zip.sha256
          $archiveStage = Join-Path $env:RUNNER_TEMP "FinEleMethod-archive-verification"
          Expand-Archive `
            -LiteralPath .\out\package\FinEleMethod-windows-x64.zip `
            -DestinationPath $archiveStage
          .\cmake\VerifyStagedApplication.ps1 `
            -StageDirectory $archiveStage `
            -ReleaseDirectory .\out\build\windows-msvc\Release

      - name: Create Windows release manifest
        shell: pwsh
        run: >-
          .\cmake\CreateWindowsReleaseManifest.ps1
          -ArchiveFile .\out\package\FinEleMethod-windows-x64.zip
          -ChecksumFile .\out\package\FinEleMethod-windows-x64.zip.sha256
          -SourceCommit ${{ github.sha }}
          -WorkflowUrl "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          -OutputFile .\out\package\FinEleMethod-windows-x64.manifest.json

      - name: Upload Windows ZIP archive
        uses: actions/upload-artifact@v7
        with:
          path: out/package/FinEleMethod-windows-x64.zip
          if-no-files-found: error
          archive: false

      - name: Upload Windows ZIP checksum
        uses: actions/upload-artifact@v7
        with:
          path: out/package/FinEleMethod-windows-x64.zip.sha256
          if-no-files-found: error
          archive: false

      - name: Upload Windows release manifest
        uses: actions/upload-artifact@v7
        with:
          path: out/package/FinEleMethod-windows-x64.manifest.json
          if-no-files-found: error
          archive: false
